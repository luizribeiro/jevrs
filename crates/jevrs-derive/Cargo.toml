[package]
name = "jevrs-derive"
description = "Derive macros for typed jevrs questions, options, and levels"
keywords = ["jev", "ai", "api", "typesafe"]
categories = ["api-bindings"]
readme = "../../README.md"
documentation = "https://docs.rs/jevrs-derive"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
jevrs = { path = "../jevrs", default-features = false }
jevrs-core = { path = "../jevrs-core" }
serde_json.workspace = true
trybuild = "1"
