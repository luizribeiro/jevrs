[package]
name = "jevrs"
description = "Async Rust client for TypeSafe AI's Jev (System One) API"
keywords = ["jev", "ai", "api", "typesafe"]
categories = ["api-bindings"]
readme = "README.md"
documentation = "https://docs.rs/jevrs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-wasip2", "wasm32-wasip3"]

[lints]
workspace = true

[features]
default = ["derive", "reqwest"]
derive = ["dep:jevrs-derive"]
reqwest = ["dep:reqwest", "dep:tokio", "reqwest/default-tls"]
native-tls = ["dep:reqwest", "dep:tokio", "reqwest/native-tls"]
web = []
test-util = []

[dependencies]
jevrs-core = { path = "../jevrs-core", version = "0.1.0" }
jevrs-derive = { path = "../jevrs-derive", version = "0.1.0", optional = true }
http.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }

[target.'cfg(all(target_arch = "wasm32", target_env = "p2"))'.dependencies]
wasi = { version = "0.14" }

[target.'cfg(all(target_arch = "wasm32", target_env = "p3"))'.dependencies]
bytes = { version = "1" }
http-body-util = { version = "0.1" }
wasip3 = { version = "0.9", features = ["http-compat"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
