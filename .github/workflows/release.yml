name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
      - name: Check flake
        run: nix flake check
      - name: Verify tag matches workspace version
        run: |
          version="$(awk '
            /^\[workspace\.package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version = "/ {
              sub(/^version = "/, "")
              sub(/".*$/, "")
              print
              exit
            }
          ' Cargo.toml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
      - name: Run pre-commit hooks
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure
      - name: Run pre-push hooks
        run: nix develop -c pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
      - name: Check dependency advisories
        run: nix develop -c cargo deny check advisories

  publish:
    needs: verify
    environment: release
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish crates
        shell: bash
        run: |
          is_published() {
            local name="$1"
            local version="$2"
            local status
            status="$(curl --silent --show-error --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              --user-agent 'jevrs release workflow (https://github.com/luizribeiro/jevrs)' \
              "https://crates.io/api/v1/crates/$name/$version")"

            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                echo "crates.io returned HTTP $status for $name@$version" >&2
                exit 1
                ;;
            esac
          }

          packages="$(
            nix develop -c cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.publish == null) | "\(.name)@\(.version)"'
          )"
          exclude_args=()
          while IFS= read -r crate_version; do
            name="${crate_version%@*}"
            version="${crate_version##*@}"
            if is_published "$name" "$version"; then
              echo "skipping $name@$version: already published"
              exclude_args+=(--exclude "$name")
            fi
          done <<< "$packages"

          nix develop -c cargo publish --workspace --locked "${exclude_args[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "jevrs ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
